[project]
name = "htmf-training"
version = "0.1.0"
description = "Neural network training for HTMF game using PyTorch"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.1", "torch==2.13.0", "onnxscript>=0.7.1"]

[project.optional-dependencies]
dev = ["ruff==0.15.21"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
